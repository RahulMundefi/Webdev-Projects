<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        
        .container{
            height: 100vh;
            width: 100vw;
            background-color: #8BC6EC;
            background-image: linear-gradient(135deg, #8BC6EC 0%, #9599E2 100%);
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .box{
            height: 570px;
            width: 360px;
            background-color:white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 10px;

        }
        .box img{
            height: 57%;
            border-radius: 10px;
        }
        
        .box h2{
            font-weight: bold;
            font-size: 1.5rem;
        }

        .box p{
            font-size: 1.2em;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <img src="qrcode.png" >
            <h2>Front end skill by projects</h2>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Numquam omnis odio repellendus qui corrupti fuga.</p>
        </div>
    </div>
</body>
</html>
